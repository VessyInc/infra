name: swc-tfst-tf

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'swc/tfstate_storage/**'
  pull_request:
    paths:
      - 'swc/tfstate_storage/**'

permissions:
  id-token: write
  contents: read

env:
  AZURE_TENANT_ID: 9cdec346-9087-4758-a5a5-2144a3ed72d4
  TF_WORKING_DIRECTORY: swc/tfstate_storage
  TF_VERSION: 1.11.0

jobs:
  tf-plan:
    name: 'Build and package'
    runs-on: ubuntu-latest
    environment: tf-build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NodeJs(Terraform wrapper)
      uses: actions/setup-node@v4
      with:
       node-version: 24

    - name: Get Token for TF Module Repo
      run: git config --global url."https://oauth2:${{ secrets.GH_REPO_PAT }}@github.com".insteadOf https://github.com

    - name: az Login
      uses: Azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SPN_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIRECTORY }}
      run: terraform init
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_SPN_ID }}
        ARM_USE_OIDC: true

    - name: Terraform Format
      working-directory: ${{ env.TF_WORKING_DIRECTORY }}
      run: terraform fmt -check
      continue-on-error: true

    - name: Fetch TFLint config
      uses: actions/checkout@v4
      with:
        repository: VessyInc/modules
        token: ${{ secrets.GH_REPO_PAT }}
        sparse-checkout: shared-actions/terraform/.tflint.hcl
        sparse-checkout-cone-mode: false
        path: .tflint-config

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4

    - name: TFLint Init
      working-directory: ${{ env.TF_WORKING_DIRECTORY }}
      run: tflint --init --config=${{ github.workspace }}/.tflint-config/shared-actions/terraform/.tflint.hcl
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Run TFLint
      working-directory: ${{ env.TF_WORKING_DIRECTORY }}
      run: tflint --config=${{ github.workspace }}/.tflint-config/shared-actions/terraform/.tflint.hcl
      continue-on-error: true

    - name: Terraform Plan
      working-directory: ${{ env.TF_WORKING_DIRECTORY }}
      run: terraform plan -input=false -out=${{ github.workspace }}/tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_SPN_ID }}
        ARM_USE_OIDC: true

    - name: Publish Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: '${{ github.workspace }}/tfplan'
        if-no-files-found: error

    - name: Convert Terraform Plan to JSON
      working-directory: ${{ env.TF_WORKING_DIRECTORY }}
      run: terraform show -json ${{ github.workspace }}/tfplan > ${{ github.workspace }}/tfplan.json

    - name: Install C3X
      run: curl -fsSL https://c3x.dev/install.sh | sh

    - name: C3X Cost Estimate
      working-directory: ${{ env.TF_WORKING_DIRECTORY }}
      run: c3x estimate --path=.
      continue-on-error: true

    - name: Run Checkov on Terraform Plan
      uses: bridgecrewio/checkov-action@v12
      with:
        file: tfplan.json
        output_format: cli
        soft_fail: true

  tf-apply:
    name: 'Deploy'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: tf-plan
    environment: tf-deploy

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NodeJs(Terraform wrapper)
      uses: actions/setup-node@v4
      with:
       node-version: 24

    - name: Get Token for TF Module Repo
      run: git config --global url."https://oauth2:${{ secrets.GH_REPO_PAT }}@github.com".insteadOf https://github.com

    - name: az Login
      uses: Azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SPN_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIRECTORY }}
      run: terraform init
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_SPN_ID }}
        ARM_USE_OIDC: true

    - name: Download Terraform Plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: ${{ github.workspace }}

    - name: Terraform Apply
      working-directory: ${{ env.TF_WORKING_DIRECTORY }}
      run: terraform apply -auto-approve ${{ github.workspace }}/tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_SPN_ID }}
        ARM_USE_OIDC: true
